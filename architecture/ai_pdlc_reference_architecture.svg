<text x="720" y="68" font-size="28" font-family="sans-serif" text-anchor="middle" fill="#0f172a">AI-PDLC Reference Architecture: Full Product Lifecycle with Amazon Quick + Coding Agent</text>
<text x="720" y="101" font-size="16" font-family="sans-serif" text-anchor="middle" fill="#64748b">Multi-Tool Collaboration Operating System for Enterprise Product Teams</text>
<text x="40" y="144" font-size="14" font-family="monospace" text-anchor="start" fill="#64748b">LIFECYCLE PHASES</text>
<text x="117.5" y="185.6" font-size="16" font-family="sans-serif" text-anchor="middle" fill="#1e293b">1. DISCOVER</text>
